services:
  http:
    image: draw-app-http:latest
    environment:
      DATABASE_URL: $DB_URL
      JWT_SECRET: $JWT_SECRET
    ports:
      - "3000:3000"

  ws:
    image: draw-app-ws:latest
    environment:
      DATABASE_URL: $DB_URL
      JWT_SECRET: $JWT_SECRET
    ports:
      - "8080:8080"
      
  frontend:
    image: draw-fe:latest
    environment:
      DATABASE_URL: $DB_URL
      JWT_SECRET: $JWT_SECRET
      NEXT_PUBLIC_BACKEND_URL: $NEXT_PUBLIC_BACKEND_URL
      NEXT_PUBLIC_WS_URL: $NEXT_PUBLIC_WS_URL
    ports:
      - "3001:3000"
